<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ClinicOS</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <h1>ClinicOS</h1>

    <section>
        <h2>Inicio de Sesión</h2>

        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
    </section>

    <section id="seccionCitas">
        <h2>Gestión de Citas</h2>

        <input type="text" id="nombrePaciente" placeholder="Nombre paciente">
        <input type="date" id="fechaCita">
        <button onclick="agendarCita()">Agendar cita</button>
        <ul id="listaCitas"></ul>
    </section>

    <section id="seccionHistoria">
        <h2>Historia Clínica</h2>

        <p>Paciente: Juan Pérez</p>
        <p>Diagnóstico: Hipertensión</p>
    </section>

    <section>
        <h2>Reportes</h2>

        <button onclick="reporte()">Generar reporte</button>
    </section>

    <script src="../scrip/app.js"></script>

</body>
</html>
