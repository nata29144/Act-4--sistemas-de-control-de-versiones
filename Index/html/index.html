<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ClinicOS</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <h1>ClinicOS</h1>

    <section id="login-screen">
        <h2>Inicio de Sesión</h2>
        <input id="usuario" type="text" placeholder="Usuario">
        <input id="clave" type="password" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
    </section>

    <div id="app-screen" class="hidden">
        <nav>
            <button onclick="showSection('citas')">Gestión de citas</button>
            <button onclick="showSection('historia')">Historia clínica</button>
            <button onclick="showSection('reportes')">Reportes</button>
        </nav>

        <section id="citas-section">
            <h2>Gestión de Citas</h2>
            <input type="text" placeholder="Nombre paciente">
            <input type="date">
            <button>Agendar cita</button>
        </section>

        <section id="historia-section" class="hidden">
            <h2>Historia Clínica</h2>
            <p>Paciente: Juan Andrés Pérez</p>
            <p>Diagnóstico: Hipertensión</p>
        </section>

        <section id="reportes-section" class="hidden">
            <h2>Reportes</h2>
            <button onclick="reporte()">Generar reporte</button>
        </section>
    </div>

    <script src="../scrip/app.js"></script>

</body>
</html>
